name: Deploy till GitHub Pages

on:
  push:
    branches: [claude/satt-upp-detta-t1j817, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # för att kunna vänta ut ev. parallell branch-deploy

# En deploy i taget; avbryt inte pågående (produktionsdeploy ska slutföras).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Enhetstester
        run: npm test

      - name: Bygg (basen /Nattljud/ för projektsajten)
        run: npm run build
        env:
          NATTLJUD_BASE: /Nattljud/

      - name: Aktivera och konfigurera Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Om Pages står i "Deploy from a branch"-läge deployar GitHub dessutom
      # branchens råa filer parallellt vid varje push – och den deploy som blir
      # klar sist vinner. Vänta därför ut den innan vi deployar det byggda, så
      # att appen alltid är det som serveras. (Byts Pages-källan till "GitHub
      # Actions" i Settings försvinner branch-deployen och steget blir en no-op.)
      - name: Vänta ut ev. parallell branch-deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              | jq '[.workflow_runs // [] | .[]
                     | select(.path == "dynamic/pages/pages-build-deployment")
                     | select(.status != "completed")] | length' 2>/dev/null || echo 1)
            if [ "$n" = "0" ]; then
              echo "Ingen pågående branch-deploy – kör vidare."
              exit 0
            fi
            echo "$n branch-deploy pågår, väntar 10 s (försök $i/30) ..."
            sleep 10
          done
          echo "Timeout efter 5 min – deployar ändå."

      - name: Deploya
        id: deployment
        uses: actions/deploy-pages@v4
